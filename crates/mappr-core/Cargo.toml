[package]
name = "mappr-core"
description = "Data loading, coordinate parsing, projection and rendering for RustyMappr"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
calamine = "0.36"
csv = "1.4"
fancy-regex = "0.19"
image = { version = "0.25", default-features = false, features = ["jpeg", "webp"] }
resvg = "0.48"
serde = { version = "1", features = ["derive"] }
shapefile = "0.9"
svg2pdf = "0.13"
thiserror = "2"
tiff = { version = "0.11", default-features = false, features = ["lzw"] }
