name: Block Claude attribution

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  check-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Scan PR commits and description for Claude/Anthropic attribution
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -e
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          found=0

          for sha in $(git rev-list "$merge_base..$HEAD_SHA"); do
            subject=$(git show -s --format='%s' "$sha")

            if git show -s --format='%ae%n%ce' "$sha" | grep -qi '@anthropic\.com'; then
              echo "::error::Commit $sha ($subject) has an anthropic.com author/committer email"
              found=1
            fi

            if git show -s --format='%B' "$sha" | grep -qiE '^(co-authored-by:.*(claude|anthropic)|claude-session:)'; then
              echo "::error::Commit $sha ($subject) has a Claude co-author or session trailer"
              found=1
            fi
          done

          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" \
              | grep -qiE '\[claude code\]\(https://claude\.com/claude-code\)|claude\.ai/code/session_|^co-authored-by:.*(claude|anthropic)'; then
            echo "::error::PR title/description contains a Claude attribution byline"
            found=1
          fi

          if [ "$found" -ne 0 ]; then
            echo
            echo "Strip the attribution (git commit --amend / git rebase -i, edit the PR description) and push again."
            exit 1
          fi

          echo "No Claude/Anthropic attribution found."
