version: 2
updates:
  # Python dependencies (requirements.txt at the repo root)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    # One PR for the whole set. Separate PRs all edit requirements.txt, so
    # they conflict with each other and each merge fires a full release
    # build; grouping them is what we already do by hand.
    groups:
      python-dependencies:
        patterns:
          - "*"

  # GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
    # Dependabot cannot group across ecosystems, so this is a second PR
    # alongside the pip one - two a month rather than one per action.
    groups:
      github-actions:
        patterns:
          - "*"
