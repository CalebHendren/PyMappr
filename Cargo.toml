[workspace]
resolver = "3"
members = ["crates/mappr-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Shapefile parsing and projection are hot paths; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.mappr-core]
opt-level = 2
